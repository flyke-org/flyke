[project]
name = "flyke-worker"
version = "0.1.0.dev0"
description = "Flyke data-plane worker for Python workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["flyke", "httpx>=0.27"]

[project.scripts]
flyke-worker = "flyke_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyke_worker"]
